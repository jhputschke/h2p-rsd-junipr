[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "h2p-rsd-junipr"
version = "0.1.0"
description = "Amortized hadron-to-parton (h2p) hadronization-inversion posterior over groomed Lund trees (RSD-JUNIPR)."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "RSD-JUNIPR authors" }]
keywords = ["jet-physics", "lund-plane", "hadronization", "simulation-based-inference", "junipr"]
dependencies = [
    "torch>=2.1",
    "numpy>=1.24",
    "omegaconf>=2.3",
    "uproot>=5.0",
    "awkward>=2.6",
]

[project.optional-dependencies]
lundnet = ["torch-geometric>=2.4"]
track = ["tensorboard>=2.14"]
# `pydantic` is imported directly by serving/api.py (request models) — declared
# explicitly rather than leaned on as a transitive fastapi dependency. `onnx` +
# `onnxscript` are what `torch.onnx.export` needs: since torch 2.9 that call
# defaults to `dynamo=True`, whose exporter lives in onnxscript. `onnxruntime` is
# only for loading the exported graph back (round-trip checks / non-torch serving).
serve = [
    "fastapi>=0.110",
    "uvicorn>=0.27",
    "pydantic>=2.0",
    "onnx>=1.16",
    "onnxscript>=0.1",
    "onnxruntime>=1.17",
]
# Calibration/diagnostic figures (`eval/report.py`) and the notebooks. Kept an
# opt-in extra, not a core dependency: without it eval still writes metrics JSON.
plots = ["matplotlib>=3.7"]
# MBR point estimator (decode.point_estimator=mbr). `pot` is the DEFAULT backend and
# the only one pulled by `[mbr]`; it is lazy-imported so the default point_estimator=map
# path needs nothing. `scikit-learn` is the posterior cluster layer's HDBSCAN/DBSCAN
# (decode.cluster_posterior=true, docs/PLAN_PosteriorClusters.md WP1) — also lazy-imported,
# and cluster_method="pam" is pure NumPy and needs none of it. `energyflow` is the optional
# reference EMD backend (decode.mbr_backend=energyflow) and lives in its own extra so the
# heavier Wasserstein/POT stack is opt-in; `[mbr-all]` installs both.
mbr = ["pot>=0.9", "scikit-learn>=1.3"]
energyflow = ["energyflow>=1.3"]
mbr-all = ["pot>=0.9", "scikit-learn>=1.3", "energyflow>=1.3"]
dev = [
    "pytest>=7.4",
    "ruff>=0.4",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.8",
    "pre-commit>=3.6",
]

[project.scripts]
h2p-rsd-junipr = "h2p_rsd_junipr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
h2p_rsd_junipr = ["py.typed"]

[tool.black]
line-length = 100
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 100

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["scripts/reference"]   # vendored original v2 script, kept verbatim

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# B905: equal-length physics loops faithfully ported from the v2 script — strict=
# everywhere is noise; B008: FastAPI-style default args.
ignore = ["E501", "B008", "B905"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = false
disallow_untyped_defs = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
