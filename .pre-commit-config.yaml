repos:
  - repo: https://github.com/psf/black
    rev: 24.4.2
    hooks:
      - id: black
  - repo: https://github.com/pycqa/isort
    rev: 5.13.2
    hooks:
      - id: isort
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.8
    hooks:
      - id: ruff
        args: [--fix]
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        additional_dependencies: [types-PyYAML]
        exclude: ^(tests|scripts)/
  - repo: https://github.com/kynan/nbstripout
    rev: 0.7.1
    hooks:
      - id: nbstripout
        # Must match EXTRA_KEYS in setup_nbstripout.sh: this hook and the git
        # filter both rewrite notebooks, and a mismatch makes them undo each
        # other. Drops the kernel choice and everything Jupyter derives from the
        # live kernel, keeping language_info.name + .pygments_lexer.
        args:
          - --extra-keys
          - >-
            metadata.kernelspec
            metadata.language_info.version
            metadata.language_info.codemirror_mode
            metadata.language_info.file_extension
            metadata.language_info.mimetype
            metadata.language_info.nbconvert_exporter
